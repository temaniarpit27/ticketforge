[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge"
version = "0.1.0"
description = "Jira-first coding and independent review with human-controlled merging"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ticketforge = "ticketforge.cli:main"

[tool.setuptools.packages.find]
include = ["ticketforge*"]

[tool.setuptools.package-data]
ticketforge = ["skills/*/SKILL.md"]
